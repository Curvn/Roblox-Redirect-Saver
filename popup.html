<!DOCTYPE html>
<html>
<head>
    <title>Roblox Redirect</title>
    <style>
        body {
            width: 260px;
            padding: 15px;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
        }

        h3 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            box-sizing: border-box;
            background: #1f2937;
            color: white;
        }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #0077ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h3>Set Place ID</h3>

    <input id="placeId" type="text" placeholder="Enter Place ID">
    <button id="saveBtn">Save</button>

    <script src="popup.js"></script>
</body>
</html>
